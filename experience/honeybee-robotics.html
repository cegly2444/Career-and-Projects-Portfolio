<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=HoneyBee%20Robotics/honeybee-robotics.html">
  <title>Redirecting to HoneyBee Robotics...</title>

  <script>
    window.location.replace("HoneyBee%20Robotics/honeybee-robotics.html");
    }

    // Keyboard Arrow Navigation (← / →)
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') {
        const prevLink = document.querySelector('.nav-arrow-prev');
        if (prevLink && prevLink.href) {
          window.location.href = prevLink.href;
        }
      } else if (e.key === 'ArrowRight') {
        const nextLink = document.querySelector('.nav-arrow-next');
        if (nextLink && nextLink.href) {
          window.location.href = nextLink.href;
        }
      }
    });

    // 1-Click Email Copy with Toast Feedback
    function copyEmail(e) {
      const email = "cegly2444@gmail.com";
      navigator.clipboard.writeText(email).then(() => {
        const toast = document.getElementById('copyToast');
        if (toast) {
          toast.classList.add('show');
          setTimeout(() => {
            toast.classList.remove('show');
          }, 2600);
        }
      }).catch(err => {
        console.error('Failed to copy: ', err);
      });
    }

    // Show Keyboard Navigation Hint only when arriving from homepage
    window.addEventListener('DOMContentLoaded', () => {
      const fromHome = sessionStorage.getItem('from_homepage') === 'true' || 
                       (document.referrer && (document.referrer.endsWith('index.html') || document.referrer.endsWith('/')));
      if (fromHome) {
        sessionStorage.removeItem('from_homepage');
        const hint = document.getElementById('navKeyHint');
        if (hint) {
          setTimeout(() => {
            hint.classList.add('show');
            setTimeout(() => {
              hint.classList.remove('show');
            }, 3800);
          }, 450);
        }
      }
    });
  </script>
</head>
<body style="background-color: #10170e; color: #ffffff; font-family: sans-serif; text-align: center; padding: 3rem;">

  <!-- Top-Right Keyboard Navigation Hint -->
  <div id="navKeyHint" class="nav-key-hint">
    <span>💡 Use <kbd>&larr;</kbd> <kbd>&rarr;</kbd> keys to navigate</span>
  </div>

  <p>Redirecting to <a href="HoneyBee%20Robotics/honeybee-robotics.html" style="color: #b6d7a8;">HoneyBee Robotics</a>...</p>

    </svg>

</body>
